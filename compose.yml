# The image tag is the deployed version: release-please rewrites the annotated `image:` lines in the
# release commit, so `main` records what prod runs. Change the tag by hand only to roll back (README,
# "Rolling back"), and then on every service.
services:
  migrate:
    image: ghcr.io/nachhilfe-leon-weimann/skillforge:v0.5.0 # x-release-please-version
    pull_policy: always
    restart: "no"
    env_file:
      - .env
    command: [ "alembic", "upgrade", "head" ]

  app:
    image: ghcr.io/nachhilfe-leon-weimann/skillforge:v0.5.0 # x-release-please-version
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  # Lifecycle guardian: reclaims expired job leases and sweeps stale prepared operations.
  # Same image as the app, separate entrypoint, pooled DB connection. Runs independently of
  # the app; SKIP LOCKED / idempotent sweeps make multiple replicas safe.
  worker:
    image: ghcr.io/nachhilfe-leon-weimann/skillforge:v0.5.0 # x-release-please-version
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [ "python", "-m", "app.workers.reaper" ]
