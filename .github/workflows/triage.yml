name: Triage

# Project intake (skillforge: docs/specs/project-intake.md): issues and PRs land on the org project with Module,
# assignee and the iteration they closed in. The work is the platform's shared workflow
# (skill-platform-workflows); this repo contributes the triggers and the repository variable PROJECT_MODULE.
#
# `issues` and `pull_request_target` run this file from `main`, with the App key, for anyone who opens an issue
# or a PR. Keep it a caller: no steps, no checkout, no `run:`.

on:
  issues:
    types: [opened, reopened, closed]
  pull_request_target:
    types: [opened, reopened, closed]

permissions: {}

jobs:
  triage:
    name: Triage
    uses: Nachhilfe-Leon-Weimann/skill-platform-workflows/.github/workflows/triage.yml@v1
    # A called workflow only gets what its caller grants: `assign-author` and `issue-type` write with GITHUB_TOKEN.
    permissions:
      issues: write
      pull-requests: write
    secrets: inherit
